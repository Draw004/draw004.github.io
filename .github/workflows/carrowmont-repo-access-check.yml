name: Carrowmont Repository Access Check

on:
  workflow_dispatch:

jobs:
  verify-repositories:
    name: Verify all 6 repositories
    runs-on: ubuntu-latest

    steps:
      - name: Check repository access
        env:
          GH_TOKEN: ${{ secrets.CARROWMONT_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          repos=(
            "Draw004/draw004.github.io"
            "Draw004/sip-calculator"
            "Draw004/goal-planner"
            "Draw004/financial-independence"
            "Draw004/inflation-calculator"
            "Draw004/retirement-planner"
          )

          echo "Checking access to all Carrowmont repositories..."
          echo

          for repo in "${repos[@]}"; do
            echo "Checking: $repo"

            response=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo")

            can_push=$(echo "$response" | jq -r '.permissions.push // false')

            if [ "$can_push" != "true" ]; then
              echo "::error::Token does not have write access to $repo"
              exit 1
            fi

            echo "OK - read/write access confirmed"
            echo
          done

          echo "SUCCESS: Token has access to all 6 repositories."
