name: Carrowmont Batch PR Publisher

on:
  workflow_dispatch:
    inputs:
      bundle_path:
        description: "Release ZIP path on the selected branch"
        required: true
        default: "carrowmont-report-standard-release.zip"
        type: string
      confirm:
        description: "Type CREATE_PRS to confirm. This workflow never merges."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: carrowmont-batch-pr-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Validate bundle, run staged QA, and create review PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout controller branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate request and unpack release bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ inputs.bundle_path }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRM" != "CREATE_PRS" ]]; then
            echo "Confirmation must be exactly CREATE_PRS."
            exit 1
          fi

          if [[ -z "$BUNDLE_PATH" || "$BUNDLE_PATH" == /* || "$BUNDLE_PATH" == *".."* ]]; then
            echo "Invalid bundle path."
            exit 1
          fi

          if [[ ! -f "$BUNDLE_PATH" ]]; then
            echo "Release bundle not found on the selected branch: $BUNDLE_PATH"
            exit 1
          fi

          rm -rf /tmp/carrowmont-bundle
          mkdir -p /tmp/carrowmont-bundle
          unzip -q "$BUNDLE_PATH" -d /tmp/carrowmont-bundle

          MANIFEST=/tmp/carrowmont-bundle/release-manifest.json
          if [[ ! -f "$MANIFEST" ]]; then
            echo "release-manifest.json is missing from the bundle."
            exit 1
          fi

          jq -e '.schema_version == 1 and (.repositories | type == "array") and (.repositories | length > 0)' "$MANIFEST" >/dev/null
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"

      - name: Authenticate GitHub CLI and Git
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CARROWMONT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing repository secret CARROWMONT_REPO_TOKEN."
            exit 1
          fi
          gh auth setup-git

      - name: Preflight repository access and clone complete QA baseline
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CARROWMONT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf staging
          mkdir -p staging

          # Release bundles may intentionally change only a subset of Carrowmont repos.
          # Validate every manifest target, then clone the complete baseline needed for
          # staged source-contract, browser, link, chart, and PDF QA.
          jq -r '.repositories[].name' "$MANIFEST" | while IFS= read -r repo; do
            case "$repo" in
              draw004.github.io|sip-calculator|goal-planner|financial-independence|inflation-calculator|retirement-calculator|carrowmont-qa) ;;
              *) echo "Repository is not on the Carrowmont allow-list: $repo"; exit 1 ;;
            esac
          done

          for repo in \
            draw004.github.io \
            sip-calculator \
            goal-planner \
            financial-independence \
            inflation-calculator \
            retirement-calculator \
            carrowmont-qa
          do
            echo "Preflight: Draw004/$repo"
            gh api "repos/Draw004/$repo" >/dev/null
            gh repo clone "Draw004/$repo" "staging/$repo" -- --depth 1 --branch main
          done

      - name: Verify reviewed base hashes and apply bundle
        shell: bash
        run: |
          set -euo pipefail
          : > publisher-validation.txt

          jq -c '.repositories[]' "$MANIFEST" | while IFS= read -r repo_json; do
            repo="$(jq -r '.name' <<< "$repo_json")"
            echo "Repository: $repo" | tee -a publisher-validation.txt

            jq -c '.files[]' <<< "$repo_json" | while IFS= read -r file_json; do
              rel="$(jq -r '.path' <<< "$file_json")"
              base_hash="$(jq -r 'if .base_sha256 == null then "__NEW__" else .base_sha256 end' <<< "$file_json")"
              new_hash="$(jq -r '.new_sha256' <<< "$file_json")"

              if [[ -z "$rel" || "$rel" == /* || "$rel" == *".."* || "$rel" == *\\* ]]; then
                echo "Unsafe file path in manifest: $rel"
                exit 1
              fi

              bundle_file="/tmp/carrowmont-bundle/$repo/$rel"
              target_file="staging/$repo/$rel"

              if [[ ! -f "$bundle_file" ]]; then
                echo "Bundle file missing: $repo/$rel"
                exit 1
              fi

              actual_new="$(sha256sum "$bundle_file" | awk '{print $1}')"
              if [[ "$actual_new" != "$new_hash" ]]; then
                echo "Bundle hash mismatch: $repo/$rel"
                exit 1
              fi

              if [[ "$base_hash" == "__NEW__" ]]; then
                if [[ -e "$target_file" ]]; then
                  echo "Expected a new file, but it already exists: $repo/$rel"
                  exit 1
                fi
              else
                if [[ ! -f "$target_file" ]]; then
                  echo "Expected base file is missing: $repo/$rel"
                  exit 1
                fi
                actual_base="$(sha256sum "$target_file" | awk '{print $1}')"
                if [[ "$actual_base" != "$base_hash" ]]; then
                  echo "Base file changed since the reviewed snapshot: $repo/$rel"
                  echo "Expected: $base_hash"
                  echo "Actual:   $actual_base"
                  echo "Nothing will be published. Create a fresh source snapshot and rebuild the release bundle."
                  exit 1
                fi
              fi

              mkdir -p "$(dirname "$target_file")"
              cp "$bundle_file" "$target_file"
              echo "  verified + staged: $rel" | tee -a publisher-validation.txt
            done
          done

      - name: Syntax-check changed JavaScript
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.repositories[]' "$MANIFEST" | while IFS= read -r repo_json; do
            repo="$(jq -r '.name' <<< "$repo_json")"
            jq -r '.files[].path' <<< "$repo_json" | while IFS= read -r rel; do
              case "$rel" in
                *.js|*.mjs) node --check "staging/$repo/$rel" ;;
              esac
            done
          done

      - name: Run Carrowmont source contract against staged multi-repo tree
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="$GITHUB_WORKSPACE/staging" node staging/carrowmont-qa/scripts/source-contract.mjs | tee staged-source-contract.txt

      - name: Build combined staging website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staged-site
          mkdir -p staged-site
          cp -a staging/draw004.github.io/. staged-site/

          for repo in sip-calculator goal-planner financial-independence inflation-calculator retirement-calculator; do
            mkdir -p "staged-site/$repo"
            cp -a "staging/$repo/." "staged-site/$repo/"
          done

      - name: Run staged Chrome browser and PDF QA
        shell: bash
        run: |
          set -euo pipefail
          QA_DIR="$GITHUB_WORKSPACE/staging/carrowmont-qa"
          ART_DIR="$GITHUB_WORKSPACE/publisher-qa-artifacts"
          mkdir -p "$ART_DIR"

          cd "$QA_DIR"
          npm install --package-lock=false
          npx playwright install --with-deps chrome

          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/staged-site" > "$GITHUB_WORKSPACE/staged-http-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            echo "Staging web server did not become ready."
            exit 1
          fi

          BASE_URL=http://127.0.0.1:4173 npm run qa:chrome | tee "$GITHUB_WORKSPACE/staged-browser-qa.txt"

          for item in qa-summary.md qa-results.json playwright-report test-results qa-artifacts; do
            if [[ -e "$item" ]]; then
              cp -a "$item" "$ART_DIR/"
            fi
          done

          kill "$SERVER_PID" >/dev/null 2>&1 || true
          trap - EXIT

          rm -rf node_modules playwright-report test-results qa-artifacts qa-summary.md qa-results.json

      - name: Verify no files outside the release manifest changed
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.repositories[]' "$MANIFEST" | while IFS= read -r repo_json; do
            repo="$(jq -r '.name' <<< "$repo_json")"
            expected="/tmp/expected-$repo.txt"
            actual="/tmp/actual-$repo.txt"
            jq -r '.files[].path' <<< "$repo_json" | sort > "$expected"
            git -C "staging/$repo" status --porcelain --untracked-files=all | cut -c4- | sort > "$actual"
            if ! diff -u "$expected" "$actual"; then
              echo "Unexpected working-tree changes detected in $repo. No PRs will be created."
              exit 1
            fi
            echo "Diff allow-list verified: $repo" | tee -a publisher-validation.txt
          done

      - name: Create feature branches and pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CARROWMONT_REPO_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          release_id="$(jq -r '.release_id' "$MANIFEST" | tr -cd 'A-Za-z0-9._-')"
          release_name="$(jq -r '.release_name' "$MANIFEST")"
          release_summary="$(jq -r '.summary' "$MANIFEST")"
          branch="carrowmont/${release_id}-${RUN_ID}"

          jq -c '.repositories[]' "$MANIFEST" | while IFS= read -r repo_json; do
            repo="$(jq -r '.name' <<< "$repo_json")"
            title="$(jq -r '.pr_title' <<< "$repo_json")"
            commit_message="$(jq -r '.commit_message' <<< "$repo_json")"
            repo_dir="$GITHUB_WORKSPACE/staging/$repo"

            cd "$repo_dir"
            git config user.name "Carrowmont Automation"
            git config user.email "carrowmont-automation@users.noreply.github.com"
            git checkout -b "$branch"
            git add -A

            if git diff --cached --quiet; then
              echo "No changes for $repo; skipping."
              continue
            fi

            git commit -m "$commit_message"
            git push --set-upstream origin "$branch"

            body_file="/tmp/pr-body-$repo.md"
            {
              echo "Automated Carrowmont batch PR created from the reviewed release bundle."
              echo
              echo "**Release:** $release_name"
              echo
              echo "$release_summary"
              echo
              echo "### Files in this repository"
              jq -r '.files[].path | "- `" + . + "`"' <<< "$repo_json"
              echo
              echo "### Safeguards"
              echo "- Reviewed base-file hashes were verified before any branch was created."
              echo "- Changed JavaScript passed syntax validation."
              echo "- The staged multi-repo source contract passed."
              echo "- Staged Chrome browser/PDF QA passed before publication."
              echo "- The working-tree diff was checked against the release allow-list."
              echo "- This automation creates a branch and pull request only. It does **not** merge."
              echo "- Calculation-engine files are not changed by this release bundle."
            } > "$body_file"

            pr_url="$(gh pr create --repo "Draw004/$repo" --base main --head "$branch" --title "$title" --body-file "$body_file")"
            {
              echo "### Draw004/$repo"
              echo "- Branch: \`$branch\`"
              echo "- Pull request: $pr_url"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload publisher validation and staged QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrowmont-batch-pr-publisher-validation
          path: |
            publisher-validation.txt
            staged-source-contract.txt
            staged-browser-qa.txt
            staged-http-server.log
            publisher-qa-artifacts/
          if-no-files-found: warn
          retention-days: 30
