name: Carrowmont Credential Expiry Guard

on:
  schedule:
    # UTC; off the top of the hour to reduce overloaded schedule queues.
    - cron: '23 5 * * *'
  workflow_dispatch:

# Independent of the release PAT; only the built-in GitHub token writes issues.
permissions:
  contents: read
  issues: write

concurrency:
  group: carrowmont-credential-expiry-guard
  cancel-in-progress: false

jobs:
  credential-expiry-guard:
    if: github.repository == 'Draw004/draw004.github.io'
    name: Check expiry and secure release-token access
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed registry and guard
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate credential and update tracked alert
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARROWMONT_REPO_TOKEN: ${{ secrets.CARROWMONT_REPO_TOKEN }}
        run: node scripts/carrowmont-credential-expiry-guard.mjs --apply
